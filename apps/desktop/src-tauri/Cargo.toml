[package]
name = "guionaria"
version = "0.1.0"
description = "Guionaria: de la idea al video listo para editar"
authors = ["Donaldo Gandara"]
edition = "2021"

[lib]
# El sufijo `_lib` evita el choque de nombres entre bin y lib en Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "guionaria_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
