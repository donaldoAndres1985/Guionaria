[project]
name = "guionaria-core"
version = "0.1.0"
description = "Núcleo local de Guionaria: API FastAPI, servidor MCP y servicios de medios."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.47",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
guionaria-core = "guionaria_core.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guionaria_core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
